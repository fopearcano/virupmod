branches:
  except:
    - /draft/
image:
- Visual Studio 2019
build:
    verbosity: detailed
environment:
  matrix:
    - BUILD_TYPE: 64bit
      GENERATOR: '"Ninja"'
      VCREDIST13: vcredist_x64.exe
      VCREDIST15: vc_redist.x64.exe
      QTPATH: 'C:\Qt\5.15.2\msvc2019_64'
      PYTHON_PATH: 'C:\Python312-x64'
      PYTHON_LIB: 'C:\Python312-x64\libs'
      PYTHON_VERSION: '3.12'
      PYTHON_URL: "https://www.python.org/ftp/python/3.12.3/python-3.12.3-embed-amd64.zip"
   #- BUILD_TYPE: 32bit
   #  QTPATH: 'C:\Qt\5.13.2\msvc2017'
   #  PYTHON_PATH: 'C:\Python37'
   #  PYTHON_LIB: 'C:\Python37\libs'
   #  GENERATOR: '"Visual Studio 15 2017"'
   #  VCREDIST13: vcredist_x86.exe
   #  VCREDIST15: vc_redist.x86.exe
   #  PYTHON_URL: "https://www.python.org/ftp/python/3.7.9/python-3.7.9-embed-win32.zip"

install:
    - call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvarsall.bat" x64
    - set INNOSETUPPATH=C:\Program Files (x86)\Inno Setup 6
    - set BINDIR=%APPVEYOR_BUILD_FOLDER%\build\
    - set Path=%QTPATH%;%QTPATH%/bin;%INNOSETUPPATH%;%PATH%

    - cd %APPVEYOR_BUILD_FOLDER%
    - IF NOT EXIST project_directory.conf (set "PROJECT_DIRECTORY=example") ELSE (for /f "delims=" %%x in (project_directory.conf) do (set "%%x"))
    - IF NOT EXIST project_directory.conf (set "HVR_DIRECTORY=.")
    - set "PROJECT_DIRECTORY=%PROJECT_DIRECTORY:/=\%"
    - set "HVR_DIRECTORY=%HVR_DIRECTORY:/=\%"
    - echo %PROJECT_DIRECTORY%
    - set BUILD_CONF=%PROJECT_DIRECTORY%\build.conf
    - echo %BUILD_CONF%
    - for /f "delims=" %%x in (%BUILD_CONF%) do (set "%%x")
    - IF NOT EXIST deps\ ( mkdir deps )
    - cd deps
    ############################################################################
    # Install Engine Dependencies
    ############################################################################
    - ..\%HVR_DIRECTORY%\ci\appveyor\install_dependencies.bat
    ############################################################################
    # Install Additional Project Dependencies
    ############################################################################
    - set USER_INSTALL=..\%PROJECT_DIRECTORY%\ci\appveyor\install_dependencies.bat
    - IF NOT EXIST %USER_INSTALL% (set USER_INSTALL=..\%HVR_DIRECTORY%\ci\appveyor\install_dependencies.bat)
    - .\%USER_INSTALL%

cache:
    - '%APPVEYOR_BUILD_FOLDER%\deps\openvr -> **\install_scripts\openvr.bat'
    #- '%APPVEYOR_BUILD_FOLDER%\deps\leap -> **\install_scripts\leap.bat'
    - '%APPVEYOR_BUILD_FOLDER%\deps\pythonqt -> **\install_scripts\pythonqt.bat'
    - '%APPVEYOR_BUILD_FOLDER%\deps\assimp -> **\install_scripts\assimp.bat'
    - '%APPVEYOR_BUILD_FOLDER%\deps\KTX-Software -> **\install_scripts\libktx.bat'
    - '%APPVEYOR_BUILD_FOLDER%\deps\zstd -> **\install_scripts\zstd.bat'
    - '%APPVEYOR_BUILD_FOLDER%\deps\libgit2 -> **\install_scripts\libgit2.bat'

before_build:
    #- IF %APPVEYOR_REPO_TAG% == true (set VERSION=%APPVEYOR_REPO_TAG_NAME%) ELSE (set VERSION=snapshot-%APPVEYOR_BUILD_NUMBER%)
    - IF %APPVEYOR_REPO_TAG% == true (set HIDE_CONSOLE=1) ELSE (set HIDE_CONSOLE=0)

build_script:
    - cd %APPVEYOR_BUILD_FOLDER%
    - mkdir build
    - cd build
    - cmake .. -G %GENERATOR% -DCMAKE_BUILD_TYPE=Release
    - set /p VERSION=<PROJECT_VERSION
    - cmake --build . --config Release
    - cd %BINDIR%
    #- tests.exe

after_build:
    - cd %BINDIR%
    - set RELEASE_DIR_NAME=%PROJECT_NAME%-%VERSION%-windows-%BUILD_TYPE%
    - set RELEASE_DIR=%BINDIR%\%RELEASE_DIR_NAME%
    - ../%HVR_DIRECTORY%/ci/appveyor/pack.bat
    - IF "%BUILD_TYPE%" == "64bit" (set ARCH=/DX64) ELSE (set ARCH=/DX86)
    - set VCREDIST13_URL="https://download.microsoft.com/download/2/E/6/2E61CFA4-993B-4DD4-91DA-3737CD5CD6E3/%VCREDIST13%"
    - set VCREDIST15_URL="https://download.microsoft.com/download/9/3/F/93FCF1E7-E6A4-478B-96E7-D4B285925B00/%VCREDIST15%"
    - appveyor DownloadFile %VCREDIST13_URL% -FileName vcredist13.exe
    - appveyor DownloadFile %VCREDIST15_URL% -FileName vcredist15.exe
    - iscc.exe %ARCH% /DPROJECT_NAME=%PROJECT_NAME% /DPROJECT_MAINTAINER=%PROJECT_MAINTAINER% /DEXTERNAL_VERSION=%VERSION% /DPROJECT_URL=%PROJECT_URL% /DLICENSE=%APPVEYOR_BUILD_FOLDER%\LICENSE /DROOT_DIR=%RELEASE_DIR% /DVCREDIST13=%RELEASE_DIR%/../vcredist13.exe /DVCREDIST15=%RELEASE_DIR%/../vcredist15.exe %APPVEYOR_BUILD_FOLDER%\%HVR_DIRECTORY%\innosetup\config.iss
    - move %APPVEYOR_BUILD_FOLDER%\%HVR_DIRECTORY%\innosetup\Output\setup.exe %APPVEYOR_BUILD_FOLDER%\%HVR_DIRECTORY%\innosetup\Output\%RELEASE_DIR_NAME%_setup.exe
    # push artifacts to Gitlab
    - IF %APPVEYOR_REPO_TAG% == true ( %APPVEYOR_BUILD_FOLDER%\%HVR_DIRECTORY%\ci\appveyor\deploy.bat )

artifacts:
  - path: build\*.zip
    name: zipfile
  - path: '**\innosetup\Output\*.exe'
    name: installer
