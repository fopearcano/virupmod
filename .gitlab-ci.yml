build:focal:
    image: $CI_REGISTRY_IMAGE:focal
    stage: build
    only:
        - pushes
    script:
        - ./hydrogenvr/ci/gitlab-ci/ubuntu/20.04/build.sh
    artifacts:
        paths:
            - build/*.deb
        expire_in: 1h

build:appimage:
    image: $CI_REGISTRY_IMAGE:focal
    stage: build
    only:
        - pushes
    script:
        - apt update
        - apt install -y qt5-default libqt5multimedia5-plugins qtdeclarative5-dev-tools
        - ./hydrogenvr/ci/gitlab-ci/commons/make-appimage.sh
    artifacts:
        paths:
            - build/*.AppImage
        expire_in: 1h

