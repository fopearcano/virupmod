pages:
    image: gcc
    stage: deploy
    only:
        - pushes
    script:
        - apt-get update && apt-get install -y cmake doxygen graphviz
        - mkdir -p build
        - cd build
        - cmake .. -DDOC_ONLY=true
        - make doc
        - mv html ..
        - cd ..
        - mv html public
    artifacts:
        paths:
            - public

