pages:
    image: gcc
    stage: deploy
    only:
        - pushes
    script:
        - ./hydrogenvr/ci/gitlab-ci/commons/deploy-pages.sh $CI_COMMIT_REF_SLUG $CI_PAGES_URL
    artifacts:
        name: "$CI_COMMIT_REF_SLUG"
        paths:
            - public

