workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME != "draft"

stages:
    - dockerbuild
    - build
    - test
    - deploy

dockerbuild:focal:
    image: docker:20.10.15
    services:
      - docker:20.10.15-dind
    stage: dockerbuild
    only:
        refs:
            - pushes
        changes:
            - hydrogenvr/ci/gitlab-ci/ubuntu/install_dependencies.sh
            - hydrogenvr/ci/gitlab-ci/ubuntu/20.04/Dockerfile
            - hydrogenvr/ci/gitlab-ci/ubuntu/20.04/install_dependencies.sh
            - .gitlab-ci.yml
            - '**/ci/gitlab-ci/ubuntu/install_dependencies.sh'
    script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        - if [[ -f ./project_directory.conf ]]; then . ./project_directory.conf ; else PROJECT_DIRECTORY=hydrogenvr/example ; fi
        - PROJ_INST_DEP=./$PROJECT_DIRECTORY/ci/gitlab-ci/ubuntu/install_dependencies.sh
        - if [ ! -f $PROJ_INST_DEP ]; then PROJ_INST_DEP=./hydrogenvr/example/ci/gitlab-ci/ubuntu/install_dependencies.sh; fi
        - docker build --pull --build-arg PROJECT_INSTALL_DEPS=$PROJ_INST_DEP -t $CI_REGISTRY_IMAGE:focal -f ./hydrogenvr/ci/gitlab-ci/ubuntu/20.04/Dockerfile --no-cache --pull .
        - docker push $CI_REGISTRY_IMAGE:focal

