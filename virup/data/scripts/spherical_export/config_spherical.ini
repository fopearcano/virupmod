# VIRUP Spherical Export Configuration
# =====================================
# This configuration file is used for exporting high-resolution spherical
# images from VIRUP. Copy this to your VIRUP config directory or use as
# a template.

[controls]
# Standard keyboard controls
alphadown=-
alphaup=+
autoexposure=E
backward=S
centercam=C
dynamicrangedown=Del
dynamicrangeup=Ins
exposuredown=PgDown
exposureup=PgUp
forward=Z
left=Q
quit=Esc
reloadpythonengine=F6
resetvrpos=+
right=D
screenshot=F10
showposition=P
timecoeffdown=R
timecoeffup=T
toggledbgcam=F1
toggledm=M
togglefullscreen=Alt+Return
togglegrid=G
togglelabels=L
toggleorbits=O
togglepyconsole=F8
togglevr=F11
togglewireframe=F2

[data]
# Data sources - adjust paths to your data location
# rootdir=/path/to/your/VIRUP-DATA/

[debugcamera]
debuginheadset=false
enabled=false
followhmd=true

[graphics]
# High quality settings for spherical export
antialiasing=4
atmoquality=5
bloom=false
dithering=true
gentexload=6
hfov=0
maxlightcasters=2
shadowsquality=5
smoothshadows=5
texmaxsize=13
vfov=0

[misc]
cubecolor=@Variant(\0\0\0\x43\x1\xff\xff\xff\xff\xff\xff\xff\xff\0\0)
maxvramusagemb=12000
mintanangle=0
showcube=false
showgrid=false

[network]
server=true

[quality]
# Maximum quality for spherical exports
atmoquality=5
gentexload=6
planetquality=7
texmaxsize=32

[scripting]
# Point to the spherical export script
rootdir=spherical_export

[simulation]
lockedrealtime=false
randomsystem=false

[vr]
# VR disabled for spherical export (not using headset)
enabled=false
mode=false
stereomultiplier=1
thirdrender=false

[window]
# Default to 360 panorama projection
projection=panorama360

# High resolution for 8K panorama export
forcewidth=8192
forceheight=4096
forcerenderresolution=true

# Window settings
fullscreen=false
hdr=true
vsync=false

# Video export mode (can be enabled for frame sequences)
videomode=false
viddir=/tmp/virup_spherical
videofps=60
maxframe=1000

# Resolution presets:
# -----------------
# panorama360 (8K):     forcewidth=8192, forceheight=4096
# panorama360 (4K):     forcewidth=4096, forceheight=2048
# vr180 (standard):     forcewidth=6000, forceheight=3000
# vr180 (high):         forcewidth=8000, forceheight=4000
# domemaster180:        forcewidth=4096, forceheight=4096
# default (4K):         forcewidth=3840, forceheight=2160
